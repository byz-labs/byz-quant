version: '3.8'

services:
  # 1. Veritabanı Katmanı: PostgreSQL
  byz-postgres:
    image: postgres:16-alpine
    container_name: byz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: byz_quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - byz-network

  # 2. Önbellek Katmanı: Redis (Hafıza Performansı İçin)
  byz-redis:
    image: redis:7-alpine
    container_name: byz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - byz-network

  # 3. Mesaj Kuyruğu Katmanı: Apache Kafka (Kraft Modu - Zookeeper Gerektirmez)
  byz-kafka:
    image: apache/kafka:3.7.0
    container_name: byz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'byz-quant-kafka-cluster-id'
    networks:
      - byz-network

volumes:
  postgres_data:
    name: byz_postgres_data  # Docker Desktop'ta görünecek net ve temiz isim
  redis_data:
    name: byz_redis_data     # Docker Desktop'ta görünecek net ve temiz isim


networks:
  byz-network:
    driver: bridge
